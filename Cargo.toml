[package]
name = "rusty_ray_tracer"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
canvas_draw = {version = "1.0.0", registry = "one_flat"}
dashmap = {version= "6.1.0", features = ["rayon"]}
linear_algebra = {version = "1.0.1", registry = "one_flat"}
noise = "0.9.0"
smallvec = "1.13.2"
rand = "0.9.0-alpha.2"
rand_distr = "0.4.3"
rayon = "1.10.0"

[profile.test] # fixed
opt-level = 2